name: Build and publish package
run-name: Build and publish package for Cobble ${{ github.ref_name }}

on:
  push:
    tags:
      - v*.*.*

jobs:
  build_linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            platform: linux/amd64
          # - os: ubuntu-24.04-arm
          #   arch: arm64
          #   platform: linux/arm64
    name: Build Linux ${{ matrix.arch }} addon
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build addon
        uses: docker/build-push-action@v6
        with:
          build-args: arch=${{ matrix.arch }}
          context: ./
          file: ./Dockerfile
          outputs: type=local, dest=./
          platforms: ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cobble-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: ./cobble-linux-${{ matrix.arch }}.node
          if-no-files-found: error

  build_macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    name: Build macOS ${{ matrix.arch }} addon
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.1.app

      - name: Build addon
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm prepack
          strip -x ./cobble-darwin-${{ matrix.arch }}.node
        env:
          MACOSX_DEPLOYMENT_TARGET: 13.5

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cobble-${{ github.ref_name }}-darwin-${{ matrix.arch }}
          path: ./cobble-darwin-${{ matrix.arch }}.node
          if-no-files-found: error

  build_windows:
    strategy:
      matrix:
        include:
          - os: windows-2025
            arch: x64
          # - os: windows-11-arm
          #   arch: arm64
    name: Build Windows ${{ matrix.arch }} addon
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build addon
        run: |
          . "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1"
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm prepack

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cobble-${{ github.ref_name }}-win32-${{ matrix.arch }}
          path: .\cobble-win32-${{ matrix.arch }}.node
          if-no-files-found: error

  publish:
    name: Publish package to registry
    permissions:
      contents: read
      packages: write
    needs:
      - build_linux
      - build_macos
      - build_windows
    runs-on: ubuntu-slim
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./
          pattern: cobble-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hereiskevin"

      - name: Build wrapper and publish package
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm build:wrapper
          pnpm publish --ignore-scripts --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
