name: Build and publish package
run-name: Build and publish package for Cobble ${{ github.ref_name }}

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build_linux:
    name: Build Linux x64 binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binary
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          outputs: type=local, dest=./
          platforms: linux/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: cobble-linux-x64.node
          path: ./cobble-linux-x64.node

  build_macos:
    name: Build macOS arm64 binaries
    runs-on: macos-15
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.1.app

      - name: Build binary
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm prepack
          strip -x ./cobble-darwin-arm64.node

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: cobble-darwin-arm64.node
          path: ./cobble-darwin-arm64.node

  publish:
    name: Publish package to registry
    permissions:
      packages: write
    needs: [build_linux, build_macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hereiskevin"

      - name: Build wrapper
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm build:wrapper
          pnpm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
